<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urua Labs — Next Generation Digital Frontier</title>
  <meta name="description" content="Urua Labs — Crypto, Music, Websites & NFTs"/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f0f0f;
      --text-light: #444;
      --accent: #0066ff;
      --gray: #f5f5f5;
      --border: #e5e5e5;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #ffffff;
        --text-light: #cccccc;
        --accent: #4d9aff;
        --gray: #111;
        --border: #222;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px; /* space for bottom nav on mobile */
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      padding: 0 5%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    @media (prefers-color-scheme: dark) {
      header {
        background: rgba(10,10,10,0.92);
      }
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .nav-menu a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-menu a:hover {
      color: var(--accent);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .hamburger span {
      width: 28px;
      height: 3px;
      background: var(--text);
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* Mobile menu overlay */
    .mobile-menu {
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      transform: translateY(-100%);
      transition: transform 0.4s ease;
      z-index: 999;
    }

    .mobile-menu.active {
      transform: translateY(0);
    }

    .mobile-menu a {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    /* Bottom nav - app style (mobile only) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      z-index: 1000;
    }

    @media (prefers-color-scheme: dark) {
      .bottom-nav {
        background: rgba(10,10,10,0.94);
      }
    }

    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-light);
      text-decoration: none;
      gap: 4px;
      transition: color 0.2s;
    }

    .bottom-nav a:hover,
    .bottom-nav a.active {
      color: var(--accent);
    }

    .bottom-nav .hamburger {
      display: flex;
    }

    /* Hero & other sections (same as before) */
    .hero {
      height: 100vh;
      min-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 5%;
      background: linear-gradient(135deg, #f0f4ff 0%, #e6f0ff 100%);
    }

    @media (prefers-color-scheme: dark) {
      .hero {
        background: linear-gradient(135deg, #0a1120 0%, #001133 100%);
      }
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: clamp(3.8rem, 9vw, 7.2rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -2px;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.5rem;
      color: var(--text-light);
      max-width: 640px;
      margin: 0 auto 2.5rem;
    }

    .hero-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      padding: 12px 32px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    .btn-outline {
      border: 2px solid var(--text);
      color: var(--text);
      padding: 12px 32px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    section {
      padding: 140px 5% 100px;
    }

    @media (max-width: 768px) {
      .nav-menu {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .bottom-nav {
        display: flex;
      }

      section {
        padding: 100px 5% 120px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">Urua Labs</a>
    
    <div class="nav-menu">
      <a href="#crypto">Crypto</a>
      <a href="#music">Music</a>
      <a href="#websites">Websites</a>
      <a href="#nfts">NFTs</a>
    </div>

    <div class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- Mobile overlay menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#crypto">Crypto</a>
    <a href="#music">Music</a>
    <a href="#websites">Websites</a>
    <a href="#nfts">NFTs</a>
  </div>

  <section class="hero">
    <div class="hero-content">
      <h1>Building the<br>Digital Future</h1>
      <p>Urua Labs — powering the next wave of Crypto, Music, Web experiences and NFT innovation.</p>
      
      <div class="hero-buttons">
        <a href="#" class="btn-primary">Explore Now</a>
        <a href="#" class="btn-outline">Learn More</a>
      </div>
    </div>
  </section>

  <!-- Bottom navigation - app feel (mobile only) -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="#crypto"><span>Crypto</span></a>
      <a href="#music"><span>Music</span></a>
      <a href="#websites"><span>Websites</span></a>
      <a href="#nfts"><span>NFTs</span></a>
      <a class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </a>
    </div>
  </nav>

  <!-- Rest of your content sections... -->
  <section>
    <h2 style="text-align:center; font-size:3rem;">Our Focus Areas</h2>
    <!-- Add your cards etc. here -->
  </section>

  <script>
    function toggleMenu() {
      document.getElementById('mobileMenu').classList.toggle('active');
    }

    // Optional: close menu when clicking a link
    document.querySelectorAll('.mobile-menu a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.remove('active');
      });
    });
  </script>
</body>
</html>
