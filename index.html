<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urua Labs — Coming Soon</title>
  <meta name="description" content="Urua Labs — Launching January 22, 2026"/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f0f0f;
      --text-light: #444;
      --accent: #0066ff;
      --gray: #f5f5f5;
      --border: #e5e5e5;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #ffffff;
        --text-light: #cccccc;
        --accent: #4d9aff;
        --gray: #111;
        --border: #222;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Header (same as before) */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      padding: 0 5%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2000;
    }

    @media (prefers-color-scheme: dark) {
      header {
        background: rgba(10,10,10,0.92);
      }
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .hamburger span {
      width: 28px;
      height: 3px;
      background: var(--text);
      border-radius: 2px;
    }

    /* Popup */
    .construction-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.6s ease;
    }

    .construction-popup.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 90%;
      text-align: center;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }

    .close-btn {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      font-size: 2rem;
      cursor: pointer;
      color: var(--text-light);
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--accent);
    }

    .popup-content h1 {
      font-size: 3.2rem;
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    .popup-content p {
      font-size: 1.3rem;
      color: var(--text-light);
      margin-bottom: 2rem;
    }

    .launch-date {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent);
      margin: 1.5rem 0;
    }

    /* Rest of styles (hero, bottom-nav, mobile-menu) - kept from previous version */
    .hero {
      height: 100vh;
      min-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 5%;
      background: linear-gradient(135deg, #f0f4ff 0%, #e6f0ff 100%);
      filter: blur(3px) brightness(0.7);
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      .hero {
        background: linear-gradient(135deg, #0a1120 0%, #001133 100%);
      }
    }

    .nav-menu { display: none; } /* hidden for simplicity in construction mode */

    .bottom-nav {
      display: none;
    }

    @media (max-width: 768px) {
      .construction-popup .popup-content {
        padding: 2.5rem 1.8rem;
      }
      .popup-content h1 {
        font-size: 2.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Under Construction Popup -->
  <div class="construction-popup active" id="constructionPopup">
    <div class="popup-content">
      <span class="close-btn" onclick="closePopup()">&times;</span>
      
      <h1>Under Construction</h1>
      <p>We're building something powerful. Stay tuned — official launch coming very soon!</p>
      
      <div class="launch-date">Opening January 22, 2026</div>
      
      <p style="font-size:1.1rem; margin-top:1.5rem;">
        Follow us on X for updates: <strong>@UruaLabs</strong>
      </p>
    </div>
  </div>

  <header>
    <a href="/" class="logo">Urua Labs</a>
    
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Building the<br>Digital Future</h1>
      <p>Urua Labs — Crypto · Music · Websites · NFTs</p>
    </div>
  </section>

  <script>
    function closePopup() {
      document.getElementById('constructionPopup').classList.remove('active');
    }

    // Optional: Auto-show on load (already active by default)
    window.addEventListener('load', () => {
      // Can add delay or logic here if needed
    });
  </script>
</body>
</html>
