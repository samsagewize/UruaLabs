<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urua Labs — Digital Future</title>
  
  <!-- Tailwind & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Babel for JSX in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['Courier New', 'monospace'],
          },
          colors: {
            accent: '#0066ff',
            retro: {
              bg: '#008080',
              win: '#c0c0c0',
              winDark: '#808080',
              blue: '#000080',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom utility for beveled borders in retro mode */
    .retro-outset {
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
    }
    .retro-inset {
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
    }
    .retro-button:active {
      border-color: #808080 #ffffff #ffffff #808080;
      padding-top: 2px;
      padding-left: 2px;
    }
    
    html { scroll-behavior: smooth; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .text-gradient {
      background: linear-gradient(to bottom, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?deps=react@19.0.0",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-white dark:bg-[#0a0a0a] text-black dark:text-white selection:bg-accent/30">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { GoogleGenAI } from '@google/genai';
    import { motion, AnimatePresence } from 'framer-motion';

    // --- Services ---
    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY || '' });

    const generateLabInsight = async (prompt) => {
      try {
        const response = await ai.models.generateContent({
          model: 'gemini-3-flash-preview',
          contents: prompt,
          config: {
            systemInstruction: `You are the Urua Labs AI Assistant. Urua Labs is a futuristic technology studio focused on Web3, Crypto, Music, Creator Economy, and Digital Experiences. 
            Your tone is visionary, professional, and slightly futuristic. 
            If asked about the launch date, say it's February 22, 2026. 
            Keep responses concise (max 2 sentences).`,
            temperature: 0.8,
          },
        });
        return response.text;
      } catch (error) {
        console.error("Gemini Error:", error);
        return "The future is slightly obscured right now. Try again in a moment.";
      }
    };

    // --- Components ---

    const AIAssistant = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([
        { role: 'model', text: 'Welcome to the lab. I can answer questions about our roadmap or vision for 2026.' }
      ]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, isLoading]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;
        const userMsg = input;
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setIsLoading(true);
        const res = await generateLabInsight(userMsg);
        setMessages(prev => [...prev, { role: 'model', text: res }]);
        setIsLoading(false);
      };

      return (
        <div className="fixed bottom-6 right-6 z-[200]">
          <AnimatePresence>
            {isOpen && (
              <motion.div
                initial={{ opacity: 0, scale: 0.9, y: 20 }}
                animate={{ opacity: 1, scale: 1, y: 0 }}
                exit={{ opacity: 0, scale: 0.9, y: 20 }}
                className="mb-4 w-80 md:w-96 bg-white dark:bg-[#111] border border-gray-200 dark:border-white/10 rounded-3xl shadow-2xl flex flex-col overflow-hidden"
              >
                <div className="p-4 bg-accent text-white font-bold flex items-center justify-between">
                  <span className="text-xs uppercase tracking-widest flex items-center gap-2">
                    <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                    Lab System v1.0
                  </span>
                  <button onClick={() => setIsOpen(false)}>✕</button>
                </div>
                <div ref={scrollRef} className="h-80 overflow-y-auto p-4 flex flex-col gap-3 text-sm">
                  {messages.map((m, i) => (
                    <div key={i} className={`p-3 rounded-2xl ${m.role === 'user' ? 'bg-gray-100 dark:bg-white/5 ml-auto rounded-tr-none' : 'bg-accent/10 text-accent mr-auto rounded-tl-none border border-accent/20'}`}>
                      {m.text}
                    </div>
                  ))}
                  {isLoading && <div className="text-xs opacity-50 animate-pulse italic">Interrogating the future...</div>}
                </div>
                <form onSubmit={handleSend} className="p-4 border-t dark:border-white/5 flex gap-2">
                  <input value={input} onChange={e => setInput(e.target.value)} placeholder="Inquire..." className="flex-1 bg-gray-50 dark:bg-black border dark:border-white/10 rounded-full px-4 py-2 outline-none focus:border-accent text-sm" />
                  <button type="submit" className="w-10 h-10 bg-accent text-white rounded-full flex items-center justify-center">→</button>
                </form>
              </motion.div>
            )}
          </AnimatePresence>
          <button onClick={() => setIsOpen(!isOpen)} className="w-16 h-16 bg-accent rounded-full shadow-xl shadow-accent/40 flex items-center justify-center hover:scale-110 active:scale-95 transition-all group">
            <span className="text-3xl group-hover:rotate-12 transition-transform">🧬</span>
          </button>
        </div>
      );
    };

    const RetroTheme = ({ onThemeToggle }) => {
      const [windows, setWindows] = useState([
        { id: 'welcome', title: 'Readme.txt', x: 20, y: 20, content: 'Urua Labs (Build 2026.02). Welcome to the legacy terminal. Double-click any icon to initialize protocols.' },
        { id: 'roadmap', title: 'Roadmap.doc', x: 220, y: 80, content: 'Q1 2026: The Great Convergence. Blockchain meets immersive audio-visual experiences.' }
      ]);

      return (
        <div className="min-h-screen bg-retro-bg font-mono p-4 select-none relative overflow-hidden" style={{ cursor: 'url(https://win98icons.alexmeub.com/icons/png/mouse-0.png), auto' }}>
          <div className="flex flex-col gap-8 items-start w-24">
            <div className="flex flex-col items-center gap-1 group cursor-pointer" onDoubleClick={() => alert('Welcome to My Lab')}>
              <img src="https://win98icons.alexmeub.com/icons/png/my_computer-0.png" className="w-10 h-10" />
              <span className="text-white text-[10px] bg-retro-blue px-1 border border-dotted border-white/50">My Lab</span>
            </div>
            <div className="flex flex-col items-center gap-1 group cursor-pointer">
              <img src="https://win98icons.alexmeub.com/icons/png/network_neighborhood-0.png" className="w-10 h-10" />
              <span className="text-white text-[10px] bg-retro-blue px-1 border border-dotted border-white/50">Network</span>
            </div>
          </div>

          {windows.map(win => (
            <div key={win.id} className="absolute bg-retro-win retro-outset w-72 md:w-96 shadow-xl" style={{ left: win.x, top: win.y }}>
              <div className="bg-retro-blue p-1 flex items-center justify-between text-white font-bold text-xs px-2">
                <div className="flex items-center gap-1">
                  <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" className="w-3 h-3" />
                  {win.title}
                </div>
                <div className="flex gap-1">
                  <button className="w-4 h-4 bg-retro-win text-black retro-outset text-[8px] font-bold">_</button>
                  <button className="w-4 h-4 bg-retro-win text-black retro-outset text-[8px] font-bold">X</button>
                </div>
              </div>
              <div className="p-3 bg-white m-1 retro-inset h-32 text-xs overflow-auto">{win.content}</div>
            </div>
          ))}

          <div className="fixed bottom-0 left-0 right-0 h-10 bg-retro-win retro-outset flex items-center px-1 z-[100]">
            <button onClick={onThemeToggle} className="h-8 px-4 bg-retro-win retro-outset flex items-center gap-2 font-bold text-sm active:retro-inset">
              <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" className="w-4 h-4" />
              Modernize
            </button>
            <div className="ml-auto px-4 py-1 bg-retro-win retro-inset font-bold text-xs">
              {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
          </div>
        </div>
      );
    };

    const ModernTheme = ({ onThemeToggle, isDarkMode, onDarkModeToggle }) => {
      const [showPopup, setShowPopup] = useState(true);

      const focus = [
        { t: "Web3 Innovation", d: "Next-gen protocols and DeFi infrastructure.", i: "💎" },
        { t: "Creator Economy", d: "Revolutionizing distribution & fan ownership.", i: "🎵" },
        { t: "Digital Arts", d: "Generative NFTs and immersive front-ends.", i: "🎨" },
        { t: "AI Synthesis", d: "Human-centric AI integration for future UX.", i: "🤖" }
      ];

      return (
        <div className="relative overflow-x-hidden pb-20">
          <header className="fixed top-0 left-0 right-0 h-20 px-8 flex items-center justify-between glass z-50">
            <span className="text-2xl font-black tracking-tighter">URUA<span className="text-accent italic">LABS</span></span>
            <nav className="hidden md:flex items-center gap-8 font-semibold text-sm">
              <a href="#focus" className="hover:text-accent transition-colors">Lab Focus</a>
              <button onClick={onThemeToggle} className="px-4 py-1.5 rounded-full border border-black/10 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/5">Nostalgia</button>
              <button onClick={onDarkModeToggle} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5">{isDarkMode ? '🌞' : '🌙'}</button>
            </nav>
          </header>

          <section className="min-h-screen flex flex-col items-center justify-center px-8 text-center pt-20">
            <motion.div initial={{ opacity: 0, y: 40 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }}>
              <h1 className="text-6xl md:text-[9rem] font-extrabold tracking-tighter leading-[0.85] mb-8 text-gradient">
                DEFINING THE <br/> BEYOND.
              </h1>
              <p className="text-lg md:text-2xl opacity-60 max-w-2xl mx-auto mb-12 font-medium">
                Urua Labs is a futuristic venture studio building the core architecture for the 2026 digital ecosystem.
              </p>
              <div className="flex flex-wrap justify-center gap-4">
                <a href="#focus" className="px-10 py-5 bg-accent text-white rounded-full font-bold text-xl hover:scale-105 transition-all shadow-2xl shadow-accent/40">Explore</a>
                <button onClick={() => setShowPopup(true)} className="px-10 py-5 border border-black/10 dark:border-white/10 rounded-full font-bold text-xl hover:bg-white/5 transition-all">Launch Info</button>
              </div>
            </motion.div>
          </section>

          <section id="focus" className="py-32 px-8 max-w-7xl mx-auto">
            <h2 className="text-4xl md:text-6xl font-black mb-16 tracking-tight">LABORATORY FOCUS</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              {focus.map((f, i) => (
                <motion.div key={i} whileHover={{ y: -10 }} className="p-10 rounded-[2.5rem] glass hover:border-accent/50 transition-all group">
                  <div className="text-5xl mb-8">{f.i}</div>
                  <h3 className="text-2xl font-bold mb-4 group-hover:text-accent transition-colors">{f.t}</h3>
                  <p className="opacity-60 text-sm font-medium leading-relaxed">{f.d}</p>
                </motion.div>
              ))}
            </div>
          </section>

          <section className="bg-accent py-24 text-white text-center relative overflow-hidden">
            <div className="text-[15rem] font-black absolute inset-0 flex items-center opacity-5 whitespace-nowrap pointer-events-none">2026 2026 2026 2026</div>
            <div className="relative z-10">
              <h2 className="text-4xl md:text-6xl font-black mb-4">FEBRUARY 22, 2026</h2>
              <p className="text-xl font-bold opacity-80 uppercase tracking-widest">Global Protocol Launch</p>
            </div>
          </section>

          <footer className="py-20 text-center opacity-40 text-xs font-bold uppercase tracking-widest">
            © 2026 Urua Labs. Architecting Null.
          </footer>

          <AnimatePresence>
            {showPopup && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/90 backdrop-blur-xl">
                <motion.div initial={{ scale: 0.9, y: 20 }} animate={{ scale: 1, y: 0 }} className="bg-white dark:bg-[#111] p-12 rounded-[3rem] max-w-lg w-full text-center relative border border-white/5">
                  <button onClick={() => setShowPopup(false)} className="absolute top-8 right-8 text-3xl font-light hover:text-accent">✕</button>
                  <div className="bg-accent/10 text-accent px-4 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-8 inline-block">System Status: Active</div>
                  <h2 className="text-4xl font-black mb-4 tracking-tight">The Void is Calling.</h2>
                  <p className="opacity-60 mb-10 font-medium">Urua Labs core systems are currently under optimization for the 2026 genesis event.</p>
                  <div className="text-4xl font-black text-accent mb-10 font-display tracking-tighter">02 . 22 . 26</div>
                  <button onClick={() => setShowPopup(false)} className="w-full py-5 bg-accent text-white rounded-3xl font-bold text-xl hover:shadow-2xl shadow-accent/20 transition-all">Synchronize</button>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    const App = () => {
      const [theme, setTheme] = useState('MODERN');
      const [isDarkMode, setIsDarkMode] = useState(true);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDarkMode);
      }, [isDarkMode]);

      return (
        <div className="min-h-screen transition-colors duration-500">
          {theme === 'MODERN' ? (
            <ModernTheme onThemeToggle={() => setTheme('RETRO')} isDarkMode={isDarkMode} onDarkModeToggle={() => setIsDarkMode(!isDarkMode)} />
          ) : (
            <RetroTheme onThemeToggle={() => setTheme('MODERN')} />
          )}
          {theme === 'MODERN' && <AIAssistant />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
