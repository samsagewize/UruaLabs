<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urua Labs — Digital Future</title>
  
  <!-- Tailwind & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Babel for JSX in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['Courier New', 'monospace'],
          },
          colors: {
            accent: '#0066ff',
            retro: {
              bg: '#008080',
              win: '#c0c0c0',
              winDark: '#808080',
              blue: '#000080',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom utility for beveled borders in retro mode */
    .retro-outset {
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
    }
    .retro-inset {
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
    }
    .retro-button:active {
      border-color: #808080 #ffffff #ffffff #808080;
      padding-top: 2px;
      padding-left: 2px;
    }
    
    html { scroll-behavior: smooth; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .text-gradient {
      background: linear-gradient(to bottom, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .retro-bg { background-color: #008080; }
    .retro-win { background-color: #c0c0c0; }
    .retro-blue { background-color: #000080; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react-dom": "https://esm.sh/react-dom@19.0.0",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "@google/genai": "https://esm.sh/@google/genai@1.38.0",
      "framer-motion": "https://esm.sh/framer-motion@11.11.11?deps=react@19.0.0"
    }
  }
  </script>
</head>
<body class="bg-white dark:bg-[#0a0a0a] text-black dark:text-white selection:bg-accent/30">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { GoogleGenAI } from '@google/genai';
    import { motion, AnimatePresence } from 'framer-motion';

    // --- AI SERVICE ---
    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY || '' });

    const askAssistant = async (prompt) => {
      try {
        const response = await ai.models.generateContent({
          model: 'gemini-3-flash-preview',
          contents: prompt,
          config: {
            systemInstruction: `You are the Urua Labs AI Assistant. Urua Labs is a futuristic venture studio.
            Focus: Web3, Crypto, Music, and Next-gen Digital Experiences.
            Launch Date: February 22, 2026.
            Tone: Visionary, concise, professional. Max 2 sentences per response.`,
            temperature: 0.7,
          },
        });
        return response.text;
      } catch (error) {
        console.error("Assistant Error:", error);
        return "The future is currently encrypted. Please try again soon.";
      }
    };

    // --- COMPONENTS ---

    const AIAssistant = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([
        { role: 'model', text: 'Hello. I am the Urua Labs Interface. How can I assist your journey to 2026?' }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const chatRef = useRef(null);

      useEffect(() => {
        if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
      }, [messages, loading]);

      const handleQuery = async (e) => {
        e.preventDefault();
        if (!input.trim() || loading) return;
        const msg = input;
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: msg }]);
        setLoading(true);
        const res = await askAssistant(msg);
        setMessages(prev => [...prev, { role: 'model', text: res }]);
        setLoading(false);
      };

      return (
        <div className="fixed bottom-6 right-6 z-[200]">
          <AnimatePresence>
            {isOpen && (
              <motion.div
                initial={{ opacity: 0, scale: 0.9, y: 20 }}
                animate={{ opacity: 1, scale: 1, y: 0 }}
                exit={{ opacity: 0, scale: 0.9, y: 20 }}
                className="mb-4 w-80 md:w-96 glass dark:bg-[#111] border dark:border-white/10 rounded-[2rem] shadow-2xl flex flex-col overflow-hidden"
              >
                <div className="p-4 bg-accent text-white font-bold flex items-center justify-between">
                  <span className="text-[10px] uppercase tracking-[0.2em] flex items-center gap-2">
                    <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                    Lab Intelligence
                  </span>
                  <button onClick={() => setIsOpen(false)} className="hover:rotate-90 transition-transform">✕</button>
                </div>
                <div ref={chatRef} className="h-80 overflow-y-auto p-4 flex flex-col gap-3 text-sm font-medium">
                  {messages.map((m, i) => (
                    <div key={i} className={`p-3 rounded-2xl ${m.role === 'user' ? 'bg-gray-100 dark:bg-white/5 ml-auto rounded-tr-none' : 'bg-accent/10 text-accent mr-auto rounded-tl-none border border-accent/20'}`}>
                      {m.text}
                    </div>
                  ))}
                  {loading && <div className="text-[10px] uppercase tracking-widest opacity-40 animate-pulse mt-2">Processing...</div>}
                </div>
                <form onSubmit={handleQuery} className="p-4 border-t dark:border-white/5 flex gap-2">
                  <input value={input} onChange={e => setInput(e.target.value)} placeholder="Type your query..." className="flex-1 bg-gray-50 dark:bg-black/50 border dark:border-white/10 rounded-full px-4 py-2 outline-none focus:border-accent text-sm" />
                  <button type="submit" className="w-10 h-10 bg-accent text-white rounded-full flex items-center justify-center">→</button>
                </form>
              </motion.div>
            )}
          </AnimatePresence>
          <button onClick={() => setIsOpen(!isOpen)} className="w-16 h-16 bg-accent rounded-full shadow-xl shadow-accent/40 flex items-center justify-center hover:scale-110 active:scale-95 transition-all group">
            <span className="text-3xl group-hover:rotate-12 transition-transform">🧬</span>
          </button>
        </div>
      );
    };

    const RetroTheme = ({ onThemeToggle }) => {
      const [wins, setWins] = useState([
        { id: 1, t: 'System.ini', c: 'Urua Labs OS v1.0\nKernel: 2026.02.22\nStatus: Optimized', x: 40, y: 40 },
        { id: 2, t: 'Roadmap.txt', c: '1. Build Foundation\n2. Integrate Intelligence\n3. Launch the Void\n4. Profit', x: 260, y: 120 }
      ]);

      return (
        <div className="min-h-screen retro-bg font-mono p-4 select-none relative overflow-hidden" style={{ cursor: 'url(https://win98icons.alexmeub.com/icons/png/mouse-0.png), auto' }}>
          <div className="flex flex-col gap-8 items-start w-24">
            <div className="flex flex-col items-center gap-1 group cursor-pointer" onDoubleClick={() => alert('Access Denied: Requires 2026 Clearance')}>
              <img src="https://win98icons.alexmeub.com/icons/png/my_computer-0.png" className="w-10 h-10" />
              <span className="text-white text-[10px] bg-retro-blue px-1 border border-dotted border-white/50">My Computer</span>
            </div>
            <div className="flex flex-col items-center gap-1 group cursor-pointer" onDoubleClick={() => alert('Empty: Recycle Bin is current')}>
              <img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png" className="w-10 h-10" />
              <span className="text-white text-[10px] bg-retro-blue px-1 border border-dotted border-white/50">Recycle Bin</span>
            </div>
          </div>

          {wins.map(w => (
            <div key={w.id} className="absolute retro-win retro-outset w-64 md:w-80 shadow-2xl" style={{ left: w.x, top: w.y }}>
              <div className="bg-retro-blue p-1 flex items-center justify-between text-white font-bold text-xs px-2">
                <div className="flex items-center gap-1 truncate max-w-[150px]">
                  <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" className="w-3 h-3" />
                  {w.t}
                </div>
                <div className="flex gap-1">
                  <button className="w-4 h-4 bg-retro-win text-black retro-outset text-[8px] font-bold">_</button>
                  <button className="w-4 h-4 bg-retro-win text-black retro-outset text-[8px] font-bold">X</button>
                </div>
              </div>
              <div className="p-3 bg-white m-1 retro-inset h-32 text-xs overflow-auto whitespace-pre-wrap">{w.c}</div>
            </div>
          ))}

          <div className="fixed bottom-0 left-0 right-0 h-10 retro-win retro-outset flex items-center px-1 z-[100]">
            <button onClick={onThemeToggle} className="h-8 px-4 retro-win retro-outset flex items-center gap-2 font-bold text-sm active:retro-inset">
              <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" className="w-4 h-4" />
              Modernize
            </button>
            <div className="ml-auto px-4 py-1 retro-win retro-inset font-bold text-xs">
              {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
          </div>
        </div>
      );
    };

    const ModernTheme = ({ onThemeToggle, isDark, toggleDark }) => {
      const [popup, setPopup] = useState(true);
      const focusAreas = [
        { t: "Web3 Protocols", d: "Scalable infrastructure for the decentralized web.", i: "💎" },
        { t: "Creative Tech", d: "Empowering creators with blockchain ownership.", i: "🎵" },
        { t: "Immersive Web", d: "High-end interfaces and spatial digital experiences.", i: "🌐" },
        { t: "Generative Systems", d: "AI-driven design and utility NFTs.", i: "🎨" }
      ];

      return (
        <div className="relative font-sans overflow-x-hidden pb-20">
          {/* Nav */}
          <header className="fixed top-0 left-0 right-0 h-20 px-8 flex items-center justify-between glass z-50">
            <span className="text-2xl font-black tracking-tighter">URUA<span className="text-accent italic">LABS</span></span>
            <nav className="hidden md:flex items-center gap-8 font-bold text-xs uppercase tracking-widest">
              <a href="#vision" className="hover:text-accent transition-colors">Vision</a>
              <a href="#labs" className="hover:text-accent transition-colors">Labs</a>
              <button onClick={onThemeToggle} className="px-4 py-2 rounded-full border dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/5">Nostalgia</button>
              <button onClick={toggleDark} className="text-xl p-2">{isDark ? '🌞' : '🌙'}</button>
            </nav>
          </header>

          {/* Hero */}
          <section className="min-h-screen flex flex-col items-center justify-center px-8 text-center pt-20">
            <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1 }}>
              <div className="inline-block px-4 py-1 rounded-full bg-accent/10 text-accent font-bold text-[10px] tracking-[0.3em] uppercase mb-8">System: Online</div>
              <h1 className="text-6xl md:text-[10rem] font-extrabold tracking-tighter leading-[0.8] mb-10 text-gradient">
                THE FUTURE <br/> IS BUILT.
              </h1>
              <p className="text-lg md:text-2xl opacity-60 max-w-2xl mx-auto mb-14 font-medium leading-relaxed">
                Urua Labs is a venture studio crafting high-performance digital architecture for the 2026 convergence.
              </p>
              <div className="flex flex-wrap justify-center gap-5">
                <a href="#labs" className="px-12 py-5 bg-accent text-white rounded-full font-bold text-lg hover:scale-105 transition-all shadow-2xl shadow-accent/40">Explore Labs</a>
                <button onClick={() => setPopup(true)} className="px-12 py-5 border dark:border-white/10 rounded-full font-bold text-lg hover:bg-white/5 transition-all">Launch Phase</button>
              </div>
            </motion.div>
          </section>

          {/* Focus Areas */}
          <section id="labs" className="py-32 px-8 max-w-7xl mx-auto">
            <div className="mb-20">
              <h2 className="text-4xl md:text-6xl font-black tracking-tighter mb-4">OUR FOCUS</h2>
              <div className="w-20 h-2 bg-accent rounded-full"></div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              {focusAreas.map((f, i) => (
                <motion.div key={i} whileHover={{ y: -10 }} className="p-10 rounded-[3rem] glass hover:border-accent/40 transition-all group relative overflow-hidden">
                  <div className="text-5xl mb-10 group-hover:scale-110 transition-transform inline-block">{f.i}</div>
                  <h3 className="text-2xl font-bold mb-4">{f.t}</h3>
                  <p className="opacity-50 text-sm font-medium leading-relaxed">{f.d}</p>
                </motion.div>
              ))}
            </div>
          </section>

          {/* Countdown */}
          <section className="bg-accent py-24 text-white text-center relative overflow-hidden">
            <motion.div animate={{ x: [-1000, 1000] }} transition={{ repeat: Infinity, duration: 20, ease: "linear" }} className="text-[20rem] font-black absolute inset-0 flex items-center opacity-10 whitespace-nowrap pointer-events-none select-none">
              2026 2026 2026 2026 2026 2026
            </motion.div>
            <div className="relative z-10">
              <h2 className="text-5xl md:text-8xl font-black mb-6 tracking-tighter">FEB 22, 2026</h2>
              <p className="text-xl font-bold opacity-80 uppercase tracking-[0.5em]">Phase One: Genesis</p>
            </div>
          </section>

          {/* Footer */}
          <footer className="py-20 text-center">
            <div className="flex justify-center gap-10 mb-10 opacity-40 font-bold text-[10px] tracking-widest uppercase">
              <a href="#" className="hover:text-accent">X</a>
              <a href="#" className="hover:text-accent">Discord</a>
              <a href="#" className="hover:text-accent">Telegram</a>
            </div>
            <p className="opacity-30 text-[10px] font-bold">© 2026 URUA LABS. ALL RIGHTS RESERVED.</p>
          </footer>

          {/* Launch Modal */}
          <AnimatePresence>
            {popup && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/95 backdrop-blur-2xl">
                <motion.div initial={{ scale: 0.9, y: 20 }} animate={{ scale: 1, y: 0 }} className="bg-white dark:bg-[#0a0a0a] p-12 rounded-[4rem] max-w-lg w-full text-center relative border dark:border-white/5 shadow-[0_0_100px_rgba(0,102,255,0.1)]">
                  <button onClick={() => setPopup(false)} className="absolute top-8 right-10 text-3xl font-light hover:text-accent transition-colors">✕</button>
                  <div className="inline-block px-4 py-1 rounded-full bg-accent/10 text-accent font-black text-[10px] tracking-widest uppercase mb-8">Waitlist: Active</div>
                  <h2 className="text-4xl font-black mb-6 tracking-tight">Access is being granted.</h2>
                  <p className="opacity-50 mb-12 font-medium leading-relaxed">Urua Labs is currently in stealth optimization mode. Enter your email to receive early clearance for our 2026 drop.</p>
                  <div className="flex flex-col gap-4">
                    <input type="email" placeholder="Email Address" className="w-full px-6 py-4 bg-gray-100 dark:bg-white/5 rounded-3xl outline-none focus:ring-2 ring-accent/50 transition-all font-bold" />
                    <button onClick={() => setPopup(false)} className="w-full py-5 bg-accent text-white rounded-[2rem] font-black text-xl hover:shadow-2xl shadow-accent/20 transition-all">Request Clearance</button>
                  </div>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    const App = () => {
      const [mode, setMode] = useState('MODERN');
      const [isDark, setIsDark] = useState(true);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      return (
        <div className="min-h-screen transition-colors duration-500">
          {mode === 'MODERN' ? (
            <ModernTheme onThemeToggle={() => setMode('RETRO')} isDark={isDark} toggleDark={() => setIsDark(!isDark)} />
          ) : (
            <RetroTheme onThemeToggle={() => setMode('MODERN')} />
          )}
          {mode === 'MODERN' && <AIAssistant />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
